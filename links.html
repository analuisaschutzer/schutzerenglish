<style>
  :root{--vinho:#6e0f19;--botao:#8f1a2e;--texto:#3d2a2a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:"Mulish",system-ui,sans-serif;color:var(--texto);-webkit-font-smoothing:antialiased;

  <!-- movimento -->
  <style id="movimento">
    /* ================= Movimento =================
       Só roda para quem não pediu "reduzir movimento" no celular/computador.
       Sem JavaScript, nada fica escondido. */
    [data-m-conta] { display: inline-block; text-align: right; white-space: nowrap; }
    .m-l { display: block; }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes m-sobe { from { opacity: 0; translate: 0 26px; } to { opacity: 1; translate: 0 0; } }
      @keyframes m-desce { from { opacity: 0; translate: 0 -18px; } to { opacity: 1; translate: 0 0; } }
      @keyframes m-surge { from { opacity: 0; translate: 0 44px; scale: 1.04; } to { opacity: 1; translate: 0 0; scale: 1; } }
      @keyframes m-pop {
        0%   { opacity: 0; scale: .35; rotate: -16deg; }
        55%  { opacity: 1; scale: 1.14; rotate: 5deg; }
        78%  { scale: .96; rotate: -2deg; }
        100% { opacity: 1; scale: 1; rotate: 0deg; }
      }
      @keyframes m-aparece { from { opacity: 0; } to { opacity: 1; } }
      @keyframes m-linha { from { translate: 0 125%; } to { translate: 0 0; } }
      @keyframes m-zoom-lento { from { scale: 1.1; } to { scale: 1; } }
      @keyframes m-brilho { from { translate: -170% 0; } to { translate: 420% 0; } }
      @keyframes m-brilho-loop { 0% { translate: -170% 0; } 22%, 100% { translate: 420% 0; } }
      @keyframes m-pulo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }

      /* Entrada ao abrir a página (não depende de JavaScript) */
      .m-e, .m-e-desce, .m-e-surge, .m-e-pop, .m-e-aparece {
        animation-duration: .8s;
        animation-timing-function: cubic-bezier(.2, .7, .2, 1);
        animation-delay: var(--d, 0s);
        animation-fill-mode: both;
      }
      .m-e { animation-name: m-sobe; }
      .m-e-desce { animation-name: m-desce; }
      .m-e-surge { animation-name: m-surge; animation-duration: 1.15s; }
      .m-e-pop { animation-name: m-pop; animation-duration: .85s; animation-timing-function: ease-out; }
      .m-e-aparece { animation-name: m-aparece; animation-duration: 1.2s; animation-timing-function: ease; }

      /* Título: cada linha sobe de dentro de uma "janela" */
      .m-l { clip-path: inset(-.4em -.5em -.2em -.5em); }
      .m-l > span { display: inline-block; animation: m-linha 1s cubic-bezier(.2, .75, .2, 1) var(--d, 0s) both; }

      /* Revelação ao rolar (o JavaScript marca e revela) */
      .js .m-r {
        opacity: 0;
        translate: 0 30px;
        transition:
          opacity .8s cubic-bezier(.2, .7, .2, 1) var(--d, 0s),
          translate .8s cubic-bezier(.2, .7, .2, 1) var(--d, 0s),
          scale .9s cubic-bezier(.2, .7, .2, 1) var(--d, 0s),
          rotate .8s cubic-bezier(.2, .7, .2, 1) var(--d, 0s),
          transform .2s ease, box-shadow .25s ease, background-color .15s ease, border-color .15s ease;
      }
      .js .m-r.m-esq { translate: -36px 0; }
      .js .m-r.m-gira { translate: 0 44px; rotate: -4deg; }
      .js .m-r.m-foto { translate: 0 18px; }
      .js .m-r.m-zoom {
        translate: none;
        scale: .84;
        transition:
          opacity .6s ease var(--d, 0s),
          scale .85s cubic-bezier(.3, 1.45, .5, 1) var(--d, 0s),
          transform .2s ease, box-shadow .25s ease;
      }
      .js .m-r.m-on { opacity: 1; translate: 0 0; scale: 1; rotate: 0deg; }

      /* Ícones que "brotam" quando a seção aparece */
      .js .m-icone { opacity: 0; scale: .3; rotate: -20deg; }
      .js .m-on .m-icone, .js .m-icone.m-on { animation: m-pop .85s ease-out calc(var(--d, 0s) + .2s) both; }

      /* Traço que se desenha da esquerda para a direita */
      .js .m-traco { scale: 0 1; transform-origin: 0 50%; transition: scale 1.1s cubic-bezier(.65, 0, .35, 1) .1s; }
      .js .m-traco.m-on { scale: 1 1; }

      /* Preço antigo sendo riscado */
      .js .m-risca { position: relative; display: inline-block; text-decoration: none; }
      .js .m-risca::after {
        content: "";
        position: absolute; left: -7%; right: -7%; top: 50%;
        height: 3px; margin-top: -1px; border-radius: 3px;
        background: var(--m-risca-cor, currentColor);
        rotate: -5deg;
        scale: 0 1; transform-origin: 0 50%;
        transition: scale .6s cubic-bezier(.65, 0, .35, 1) calc(var(--d, 0s) + .45s);
      }
      .js .m-on .m-risca::after { scale: 1 1; }

      /* Brilho que passa pelo botão */
      .m-brilho, .m-brilho-loop { position: relative; overflow: hidden; isolation: isolate; }
      .m-brilho::after, .m-brilho-loop::after {
        content: "";
        position: absolute; top: 0; bottom: 0; left: 0; width: 30%;
        background: linear-gradient(105deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, .42) 50%, rgba(255, 255, 255, 0) 100%);
        translate: -170% 0;
        pointer-events: none;
      }
      .m-on .m-brilho::after, .m-brilho.m-on::after { animation: m-brilho 1.2s ease-in-out .75s 1 both; }
      .m-brilho-loop::after { animation: m-brilho-loop 5.5s ease-in-out var(--d-brilho, 2s) infinite both; }

      /* Computador: cartões levantam ao passar o mouse */
      @media (hover: hover) and (pointer: fine) {
        .m-hover:hover { transform: translateY(-6px); box-shadow: 0 18px 38px rgba(40, 20, 15, .14); }
      }
    }
  </style>
